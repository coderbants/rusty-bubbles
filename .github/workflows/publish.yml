name: Publish to Crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch sibling charming-bubbletea (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-bubbletea
          path: siblings/charming-bubbletea
          ref: dev
      - name: Fetch sibling charming-colorprofile (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-colorprofile
          path: siblings/charming-colorprofile
          ref: dev
      - name: Fetch sibling charming-lipgloss (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-lipgloss
          path: siblings/charming-lipgloss
          ref: dev
      - name: Fetch sibling charming-testkit (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-testkit
          path: siblings/charming-testkit
          ref: dev
      - name: Fetch sibling charming-ultraviolet (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-ultraviolet
          path: siblings/charming-ultraviolet
          ref: dev
      - name: Fetch sibling charming-x-ansi (pinned)
        uses: actions/checkout@v4
        with:
          repository: coderbants/charming-x-ansi
          path: siblings/charming-x-ansi
          ref: dev
      - name: Place sibling crates
        run: |
          mkdir -p ../siblings && true
          mv siblings/charming-bubbletea ../charming-bubbletea
          mv siblings/charming-colorprofile ../charming-colorprofile
          mv siblings/charming-lipgloss ../charming-lipgloss
          mv siblings/charming-testkit ../charming-testkit
          mv siblings/charming-ultraviolet ../charming-ultraviolet
          mv siblings/charming-x-ansi ../charming-x-ansi
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
      - name: Upstream mapping verification
        run: ./scripts/verify_mapping.sh
      # Releases are tag-gated: only pushes of a v* tag publish. crates.io
      # rejects re-publishing an existing version, so the version-bump gate
      # in ci.yml keeps every release on a fresh, unreleased version.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Upload source to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          src="${GITHUB_REPOSITORY##*/}-$GITHUB_REF_NAME.tar.gz"
          git archive --format=tar.gz -o "$src" HEAD
          gh release upload "$GITHUB_REF_NAME" "$src" --clobber
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
            cargo publish --token "${CARGO_REGISTRY_TOKEN}"
          else
            echo "No CARGO_REGISTRY_TOKEN secret; skipping crates.io publish."
          fi
