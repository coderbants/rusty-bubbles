name: Publish to Crates.io

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish Crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Docgen
        run: cargo doc --no-deps
      - name: Test (all targets, all integration tests)
        run: cargo test --all-targets
      - name: Upstream mapping verification
        run: ./scripts/verify_mapping.sh
      # Every merge to the live branch publishes to crates.io. crates.io
      # rejects re-publishing an existing version, so the version-bump gate
      # in ci.yml must pass for any merge to land (every merge carries a new
      # tagged version).
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token ${CARGO_REGISTRY_TOKEN}
